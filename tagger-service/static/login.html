<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — AI Tagging Assistant</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600&display=swap">
<style>
  :root { --sm-green: #025600; }
  h1, h2, h3, h4, h5, h6 { font-family: 'Roboto Slab', serif; }
  .btn-primary { --bs-btn-bg: var(--sm-green); --bs-btn-border-color: var(--sm-green);
                 --bs-btn-hover-bg: #013d00; --bs-btn-hover-border-color: #013d00;
                 --bs-btn-active-bg: #013d00; --bs-btn-active-border-color: #013d00; }
</style>
</head>
<body data-page="login" class="bg-light">

<main class="container py-5" style="max-width: 460px">
  <div class="card">
    <div class="card-body">
      <h1 class="h4 card-title mb-3">AI Tagging Assistant</h1>
      <p class="text-body-secondary">Historians and reviewers open this app from the WordPress site.
        The admin passphrase here is for the owner.</p>
      <div class="alert alert-danger" id="login-error" hidden></div>
      <form id="login-form">
        <div class="mb-3">
          <label class="form-label" for="login-key">Admin passphrase</label>
          <input type="password" class="form-control" id="login-key" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>
    </div>
  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
